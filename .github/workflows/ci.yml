name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install (core only)
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install pytest ruff

      - name: Zero-dependency core check
        run: python -c "import kubeguard, kubeguard.cli, kubeguard.rules, kubeguard.analyze, kubeguard.sarif, kubeguard.yamlio; print('core imports with no third-party package')"

      - name: Lint
        run: ruff check src tests

      - name: Tests
        run: pytest -q

      - name: Console scripts work from a base install
        run: |
          kubeguard --help
          kubeguard rules | head -3

      - name: Demo end to end
        # `shell: bash` is not cosmetic: windows-latest defaults to pwsh, where
        # `if cmd; then` is a ParserError ("Missing '(' after 'if' in if statement").
        shell: bash
        run: |
          kubeguard demo --dir demo-workspace
          if kubeguard scan demo-workspace --fail-on critical; then
            echo "expected a non-zero exit: the demo manifest is deliberately hostile"
            exit 1
          fi
          echo "gate correctly blocked the demo manifest"

      - name: A hardened manifest passes the high gate
        shell: bash
        run: |
          mkdir -p clean
          cat > clean/deployment.yaml <<'YAML'
          apiVersion: apps/v1
          kind: Deployment
          metadata:
            name: web
            labels:
              app.kubernetes.io/name: web
              app.kubernetes.io/part-of: shop
          spec:
            selector:
              matchLabels:
                app: web
            template:
              metadata:
                labels:
                  app: web
              spec:
                automountServiceAccountToken: false
                serviceAccountName: web
                securityContext:
                  runAsNonRoot: true
                  seccompProfile:
                    type: RuntimeDefault
                containers:
                  - name: web
                    image: nginx:1.25@sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
                    imagePullPolicy: Always
                    readinessProbe:
                      httpGet: {path: /ready, port: 80}
                    livenessProbe:
                      httpGet: {path: /live, port: 80}
                    securityContext:
                      allowPrivilegeEscalation: false
                      readOnlyRootFilesystem: true
                      capabilities:
                        drop: ["ALL"]
                    resources:
                      limits: {cpu: 500m, memory: 256Mi}
                      requests: {cpu: 100m, memory: 128Mi}
          ---
          apiVersion: v1
          kind: ServiceAccount
          metadata:
            name: web
          ---
          apiVersion: networking.k8s.io/v1
          kind: NetworkPolicy
          metadata:
            name: web
          spec:
            podSelector:
              matchLabels:
                app: web
            policyTypes: ["Ingress"]
          YAML
          kubeguard scan clean --fail-on high

      - name: SARIF output is valid
        run: |
          kubeguard scan demo-workspace --format sarif --output results.sarif
          # encoding is explicit: on the Windows runner open() defaults to
          # cp1252 and the SARIF carries non-ASCII rule text
          python -c "import json; d=json.load(open('results.sarif', encoding='utf-8')); assert d['version']=='2.1.0' and d['runs'][0]['results']; print('sarif ok')"

      - name: MCP manifest
        run: |
          python -m pip install -e ".[mcp]"
          python -c "
          import asyncio
          from kubeguard.mcp_server import build_server, tool_manifest
          names = [t['name'] for t in tool_manifest()]
          assert all(t['description'] for t in tool_manifest())
          tools = asyncio.run(build_server().list_tools())
          print(f'{len(names)} tools:', ', '.join(sorted(names)))
          assert len(tools) == len(names)
          "

  # The README test badge is the first number a visitor reads; assert it against
  # pytest so it cannot drift silently.
  badge:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[mcp]" pytest
      - name: README test-count badge vs pytest
        run: |
          collected=$(python -m pytest --collect-only -q -o addopts= 2>/dev/null | grep -oE '[0-9]+ tests? collected' | grep -oE '^[0-9]+' || true)
          badge=$(grep -oE 'tests-[0-9]+%20passing' README.md | head -1 | grep -oE '[0-9]+' || true)
          echo "collected=${collected:-NOTHING} badge=${badge:-NONE}"
          if [ -z "$collected" ]; then
            echo "::warning::pytest collected nothing - the badge check did not run"
          elif [ "$collected" != "$badge" ]; then
            echo "::warning::README badge says $badge but pytest collects $collected"
          fi
